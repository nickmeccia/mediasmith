[project]
name = "mediasmith"
version = "0.1.0"
description = "A media-library browser and toolbench for the terminal."
requires-python = ">=3.12"
dependencies = [
    "textual>=8",
    "textual-image",
    "mutagen",
    "pillow",
    "guessit",
    "send2trash>=2.1.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    # subtitle download (was a Homebrew keg spliced in at runtime) and the
    # MKV header parser that replaced ffprobe's title read. enzyme arrives
    # via subliminal too, but container.py imports it directly, so it is
    # declared directly.
    "subliminal>=2.7.1",
    "enzyme>=0.5.2",
]

[project.scripts]
mediasmith = "mediasmith.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
